{% extends 'base.html' %}

{% block title %}课程审核{% endblock %}

{% block content %}
<h2>待审核课程</h2>
<a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary mb-3">返回仪表盘</a>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>课程名称</th>
                <th>教师</th>
                <th>分类</th>
                <th>提交时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.id }}</td>
                <td>{{ course.title }}</td>
                <td>{{ course.teacher_name }}</td>
                <td>{{ course.category }}</td>
                <td>{{ course.created_at }}</td>
                <td>
                    <form action="{{ url_for('admin.approve_course', course_id=course.id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-success btn-sm">通过</button>
                    </form>
                    <form action="{{ url_for('admin.reject_course', course_id=course.id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm">拒绝</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" class="text-center">暂无待审核课程</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
