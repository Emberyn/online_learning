{% extends 'base.html' %}

{% block title %}教学数据 - 教师中心{% endblock %}

{% block content %}
<div class="row mt-3">
    <div class="col-md-3">
        <div class="list-group shadow-sm">
            <a href="{{ url_for('teacher.my_courses') }}" class="list-group-item list-group-item-action">我的课程</a>
            <a href="{{ url_for('teacher.manage_assignments') }}" class="list-group-item list-group-item-action">作业管理</a>
            <a href="{{ url_for('teacher.statistics') }}" class="list-group-item list-group-item-action active">教学数据</a>
        </div>
    </div>

    <div class="col-md-9 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0 fw-bold">教学数据概览</h2>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-primary text-white h-100" style="background: linear-gradient(135deg, #4361ee 0%, #3f37c9 100%);">
                    <div class="card-body position-relative">
                        <h6 class="opacity-75 mb-2">已发布课程</h6>
                        <h2 class="display-5 fw-bold mb-0">{{ course_count }} <small class="fs-6 fw-normal">门</small></h2>
                        <i class="bi bi-book-half position-absolute opacity-25" style="font-size: 4rem; right: 15px; bottom: -5px;"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-info text-white h-100" style="background: linear-gradient(135deg, #4cc9f0 0%, #4895ef 100%);">
                    <div class="card-body position-relative">
                        <h6 class="opacity-75 mb-2">累计选课人次</h6>
                        <h2 class="display-5 fw-bold mb-0">{{ student_count }} <small class="fs-6 fw-normal">人</small></h2>
                        <i class="bi bi-people-fill position-absolute opacity-25" style="font-size: 4rem; right: 15px; bottom: -5px;"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-success text-white h-100" style="background: linear-gradient(135deg, #20c997 0%, #198754 100%);">
                    <div class="card-body position-relative">
                        <h6 class="opacity-75 mb-2">收到的作业数</h6>
                        <h2 class="display-5 fw-bold mb-0">{{ submission_count }} <small class="fs-6 fw-normal">份</small></h2>
                        <i class="bi bi-file-earmark-check-fill position-absolute opacity-25" style="font-size: 4rem; right: 15px; bottom: -5px;"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold mb-0"><i class="bi bi-bar-chart-fill text-primary me-2"></i>各课程选课人数统计 (实时)</h5>
            </div>
            <div class="card-body">
                <div id="courseEnrollmentChart" style="width: 100%; height: 380px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 请求后端数据
        fetch('{{ url_for("teacher.enrollment_stats") }}')
            .then(response => response.json())
            .then(data => {
                if(data.error) { return; }

                // 初始化 ECharts 实例
                var chartDom = document.getElementById('courseEnrollmentChart');
                var myChart = echarts.init(chartDom);

                var option = {
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'shadow' }, // 悬浮时显示背景阴影
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        borderColor: '#eee',
                        textStyle: { color: '#2b2d42' }
                    },
                    grid: {
                        left: '3%', right: '4%', bottom: '3%', containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: data.labels,
                        axisTick: { alignWithLabel: true },
                        axisLine: { lineStyle: { color: '#dee2e6' } },
                        axisLabel: { color: '#6c757d', margin: 15 }
                    },
                    yAxis: {
                        type: 'value',
                        splitLine: { lineStyle: { type: 'dashed', color: '#f8f9fa' } },
                        axisLabel: { color: '#6c757d' }
                    },
                    series: [
                        {
                            name: '选课人数',
                            type: 'bar',
                            barWidth: '35%', // 柱子不要太宽，显得更精致
                            itemStyle: {
                                // 柱子顶部圆角
                                borderRadius: [8, 8, 0, 0],
                                // ECharts 专属：高级渐变色填充
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: '#4cc9f0' }, // 顶部亮蓝
                                    { offset: 1, color: '#4361ee' }  // 底部深蓝
                                ])
                            },
                            data: data.values
                        }
                    ]
                };

                myChart.setOption(option);

                // 监听浏览器窗口变化，让图表自适应缩放
                window.addEventListener('resize', function() {
                    myChart.resize();
                });
            });
    });
</script>
{% endblock %}
