{% extends 'base.html' %}

{% block title %}登录 - 在线学习平台{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-4 fade-in">
        <div class="card shadow-lg border-0" style="border-radius: 16px;">
            <div class="card-header bg-gradient-primary text-center pt-4 pb-3 border-0" style="border-top-left-radius: 16px; border-top-right-radius: 16px;">
                <i class="bi bi-person-circle fs-1 text-white mb-2 d-inline-block opacity-75"></i>
                <h4 class="mb-0 fw-bold text-white">欢迎回来</h4>
                <p class="text-white-50 small mb-0 mt-1">请登录您的账户</p>
            </div>

            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label text-muted small fw-bold">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-bold">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">登 录</button>
                    </div>
                </form>
            </div>

            <div class="card-footer bg-white text-center py-3 border-top-0" style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
                <span class="text-muted small">还没有账号？</span>
                <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none small">立即免费注册</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
