{% extends 'base.html' %}

{% block title %}发布新课程{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">发布新课程</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">课程名称</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">课程分类</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="编程开发">编程开发</option>
                            <option value="人工智能">人工智能</option>
                            <option value="数据科学">数据科学</option>
                            <option value="设计创作">设计创作</option>
                            <option value="语言学习">语言学习</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">课程简介</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">提交审核</button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">返回仪表盘</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
