{% extends 'base.html' %}

{% block title %}发布新课程 - 教师中心{% endblock %}

{% block content %}
<div class="row mt-3">
    <div class="col-md-3">
        <div class="list-group shadow-sm">
            <a href="{{ url_for('main.dashboard') }}" class="list-group-item list-group-item-action">仪表盘</a>
            <a href="{{ url_for('teacher.create_course') }}" class="list-group-item list-group-item-action active">发布新课程</a>
            <a href="{{ url_for('teacher.my_courses') }}" class="list-group-item list-group-item-action">我的课程</a>
            <a href="{{ url_for('teacher.manage_assignments') }}" class="list-group-item list-group-item-action">作业管理</a>
        </div>
    </div>

    <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>发布新课程</h2>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="{{ url_for('teacher.create_course') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">课程名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="请输入课程名称">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">课程分类 <span class="text-danger">*</span></label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="">请选择分类...</option>
                            <option value="计算机与IT">计算机与IT</option>
                            <option value="外语学习">外语学习</option>
                            <option value="理学与工学">理学与工学</option>
                            <option value="文学与艺术">文学与艺术</option>
                            <option value="经济与管理">经济与管理</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">课程简介 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="description" name="description" rows="5" required placeholder="请简要描述本课程的教学内容和目标..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="objectives" class="form-label">课程目标</label>
                        <textarea class="form-control" id="objectives" name="objectives" rows="3" placeholder="请描述学习本课程后能达到什么目标..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">课程内容</label>
                        <textarea class="form-control" id="content" name="content" rows="5" placeholder="请详细描述课程的具体内容..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="outline" class="form-label">课程大纲</label>
                        <textarea class="form-control" id="outline" name="outline" rows="5" placeholder="例如：第一章 xxx&#10;第二章 xxx"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-4">提交审核</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
